<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpense - Expenses</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f8fb; color: #1a1a2e; display: flex; min-height: 100vh; }
        .sidebar { width: 210px; background: #fff; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: fixed; height: 100vh; border-right: 1px solid #ebebf0; }
        .sidebar-brand { display: flex; align-items: center; gap: 8px; padding: 8px 12px 20px; }
        .brand-icon { width: 32px; height: 32px; background: #6c47ff; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
        .brand-text { font-size: 15px; font-weight: 700; }
        .brand-sub { font-size: 11px; color: #999; }
        .xp-section { background: #f8f8fb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .xp-label { font-size: 11px; color: #999; display: flex; justify-content: space-between; }
        .xp-level { font-size: 22px; font-weight: 700; margin: 2px 0; }
        .xp-bar { height: 4px; background: #ebebf0; border-radius: 2px; margin-top: 6px; }
        .xp-fill { height: 4px; background: #6c47ff; border-radius: 2px; }
        .nav-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; color: #666; font-size: 14px; transition: all 0.2s; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: #f0eeff; color: #6c47ff; }
        .nav-item.active { background: #6c47ff; color: #fff; }
        .sidebar-bottom { margin-top: auto; }
        .user-section { display: flex; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid #ebebf0; }
        .user-avatar { width: 32px; height: 32px; background: #6c47ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 13px; font-weight: 600; }
        .user-email { font-size: 11px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logout-btn { background: none; border: none; color: #999; cursor: pointer; font-size: 14px; }
        .main { margin-left: 210px; padding: 32px 36px; flex: 1; }
        .page-title { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .page-sub { color: #999; font-size: 14px; margin-bottom: 24px; }
        .add-row { background: #fff; border: 1px solid #ebebf0; border-radius: 12px; padding: 16px 20px; display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
        .add-row select, .add-row input { padding: 10px 14px; border: 1px solid #ebebf0; border-radius: 8px; font-size: 14px; color: #1a1a2e; background: #fff; outline: none; }
        .add-row select { width: 160px; }
        .add-row input[type="number"] { width: 140px; }
        .add-row input[type="date"] { width: 160px; }
        .add-row input[type="text"] { flex: 1; }
        .add-row select:focus, .add-row input:focus { border-color: #6c47ff; }
        .btn-add { padding: 10px 24px; background: #6c47ff; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-add:hover { background: #5535e0; }
        .table-card { background: #fff; border: 1px solid #ebebf0; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 20px; font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #ebebf0; }
        td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #f5f5f8; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .cat-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; background: #f0eeff; color: #6c47ff; }
        .amount { font-weight: 600; }
        .action-btn { background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
        .action-btn:hover { background: #f5f5f8; }
        .empty { text-align: center; color: #999; padding: 48px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">💸</div>
        <div><div class="brand-text">XPense</div><div class="brand-sub">Level up your wallet</div></div>
    </div>
    <div class="xp-section">
        <div class="xp-label"><span>Level</span><span id="sideXP">0 XP</span></div>
        <div class="xp-level" id="sideLevel">1</div>
        <div style="font-size:12px;color:#999" id="sideProgress">0/100</div>
        <div class="xp-bar"><div class="xp-fill" id="sideXpFill" style="width:0%"></div></div>
    </div>
    <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
    <a href="expenses.html" class="nav-item active">📋 Expenses</a>
    <a href="budget.html" class="nav-item">🎯 Budgets</a>
    <a href="challenges.html" class="nav-item">⚡ Challenges</a>
    <a href="xp.html" class="nav-item">🏆 XP & Rewards</a>
    <a href="friends.html" class="nav-item">👥 Friends</a>
    <a href="monthly-report.html" class="nav-item">📅 Monthly Report</a>
    <a href="settings.html" class="nav-item">⚙️ Settings</a>
    <div class="sidebar-bottom">
        <div class="user-section">
            <div class="user-avatar" id="avatarLetter">U</div>
            <div class="user-info">
                <div class="user-name" id="sideUserName">User</div>
                <div class="user-email" id="sideUserEmail"></div>
            </div>
            <button class="logout-btn" onclick="logout()">⇥</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="page-title">Expenses</div>
    <div class="page-sub">Add, edit and review your spending.</div>

    <div class="add-row">
        <select id="category">
            <option value="Food">Food</option>
            <option value="Groceries">Groceries</option>
            <option value="Travel">Travel</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Online Shopping">Online Shopping</option>
            <option value="Other">Other</option>
        </select>
        <input type="number" id="amount" placeholder="Amount (₹)" min="0" />
        <input type="date" id="expenseDate" />
        <input type="text" id="note" placeholder="Note (optional)" />
        <button class="btn-add" onclick="addExpense()">+ Add</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Note</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="expensesTable">
            <tr><td colspan="5" class="empty">No expenses yet</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/api';
    const userId = localStorage.getItem('userId');
    const userName = localStorage.getItem('userName');
    if (!userId) window.location.href = 'index.html';

    document.getElementById('sideUserName').textContent = userName || 'User';
    document.getElementById('avatarLetter').textContent = (userName || 'U')[0].toUpperCase();
    document.getElementById('expenseDate').valueAsDate = new Date();

    async function loadSidebar() {
        const res = await fetch(`${API}/users/${userId}`);
        if (res.ok) {
            const user = await res.json();
            const xp = user.totalXp || 0;
            const level = Math.floor(xp / 100) + 1;
            const progress = xp % 100;
            document.getElementById('sideXP').textContent = xp + ' XP';
            document.getElementById('sideLevel').textContent = level;
            document.getElementById('sideProgress').textContent = progress + '/100';
            document.getElementById('sideXpFill').style.width = progress + '%';
        }
    }

    async function loadExpenses() {
        const res = await fetch(`${API}/expenses?userId=${userId}`);
        if (res.ok) {
            const expenses = await res.json();
            renderTable(expenses.reverse());
        }
    }

    function renderTable(expenses) {
        const tbody = document.getElementById('expensesTable');
        if (!expenses.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">No expenses yet — add your first one!</td></tr>';
            return;
        }
        tbody.innerHTML = expenses.map(e => `
            <tr>
                <td>${formatDate(e.expenseDate)}</td>
                <td><span class="cat-badge">${e.category}</span></td>
                <td class="amount">₹${e.amount.toLocaleString()}</td>
                <td style="color:#999">${e.note || '—'}</td>
                <td>
                    <button class="action-btn" onclick="deleteExpense('${e.id}')" title="Delete">🗑️</button>
                </td>
            </tr>`).join('');
    }

    function formatDate(d) {
        if (!d) return '—';
        const date = new Date(d);
        return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function addExpense() {
        const amount = document.getElementById('amount').value;
        const category = document.getElementById('category').value;
        const note = document.getElementById('note').value;
        const date = document.getElementById('expenseDate').value;
        if (!amount || amount <= 0) return alert('Enter a valid amount');
        const res = await fetch(`${API}/expenses`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, category, amount, note, expenseDate: date })
        });
        if (res.ok) {
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            loadExpenses();
            loadSidebar();
        }
    }

    async function deleteExpense(id) {
        if (!confirm('Delete this expense?')) return;
        const res = await fetch(`${API}/expenses/${id}?userId=${userId}`, {
            method: 'DELETE'
        });
        if (res.ok) loadExpenses();
    }

    async function logout() {
        try {
            await fetch(`${API}/users/logout`, { method: 'POST' });
        } catch(e) {}
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = 'index.html';
    }
    loadSidebar();
    loadExpenses();
</script>
</body>
</html>
