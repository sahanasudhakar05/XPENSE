<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpense - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8f8fb;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border: 1px solid #ebebf0;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .brand-icon { width: 36px; height: 36px; background: #6c47ff; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
        .brand-name { font-size: 20px; font-weight: 700; }
        .brand-sub { font-size: 12px; color: #999; }
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid #ebebf0; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #999; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
        .tab.active { color: #6c47ff; border-bottom-color: #6c47ff; }
        .form-group { margin-bottom: 14px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
        input, select {
            width: 100%; padding: 11px 14px;
            border: 1px solid #ebebf0; border-radius: 10px;
            font-size: 14px; color: #1a1a2e;
            background: #fff; outline: none; transition: border 0.2s;
        }
        input:focus, select:focus { border-color: #6c47ff; }
        input::placeholder { color: #bbb; }
        .btn {
            width: 100%; padding: 12px;
            background: #6c47ff; border: none;
            border-radius: 10px; color: #fff;
            font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 4px;
        }
        .btn:hover { background: #5535e0; }
        .msg { font-size: 13px; margin-top: 12px; padding: 10px 14px; border-radius: 8px; display: none; }
        .error { color: #ef4444; background: #fef2f2; border: 1px solid #fecaca; }
        .success { color: #22c55e; background: #f0fdf4; border: 1px solid #bbf7d0; }
        .forgot-link { text-align: right; margin-bottom: 14px; }
        .forgot-link a { font-size: 12px; color: #6c47ff; cursor: pointer; text-decoration: none; }
        .forgot-link a:hover { text-decoration: underline; }
        .back-link { text-align: center; margin-top: 14px; }
        .back-link a { font-size: 13px; color: #6c47ff; cursor: pointer; text-decoration: none; }
        .step-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .step-sub { font-size: 13px; color: #999; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">
        <div class="brand-icon">💸</div>
        <div>
            <div class="brand-name">XPense</div>
            <div class="brand-sub">Level up your wallet</div>
        </div>
    </div>

    <!-- Login / Signup tabs -->
    <div id="authSection">
        <div class="tabs">
            <div class="tab active" id="tabLogin" onclick="showTab('login')">Login</div>
            <div class="tab" id="tabSignup" onclick="showTab('signup')">Sign Up</div>
        </div>

        <!-- Login -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" />
            </div>
            <div class="forgot-link"><a onclick="showForgot()">Forgot password?</a></div>
            <button class="btn" onclick="login()">Login</button>
        </div>

        <!-- Signup -->
        <div id="signupForm" style="display:none">
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="signupName" placeholder="Your name" />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="your@email.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Min 6 characters" />
            </div>
            <div class="form-group">
                <label>Security Question</label>
                <input type="text" id="signupQuestion" placeholder="e.g. What was your first pet's name?" />
            </div>

            <div class="form-group">
                <label>Security Answer</label>
                <input type="text" id="signupAnswer" placeholder="Your answer" />
            </div>
            <button class="btn" onclick="signup()">Create Account</button>
        </div>

        <div class="msg error" id="authError"></div>
        <div class="msg success" id="authSuccess"></div>
    </div>

    <!-- Forgot Password -->
    <div id="forgotSection" style="display:none">
        <!-- Step 1: Enter email -->
        <div id="forgotStep1">
            <div class="step-title">Reset Password</div>
            <div class="step-sub">Enter your email to find your account.</div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="forgotEmail" placeholder="your@email.com" />
            </div>
            <button class="btn" onclick="getSecurityQuestion()">Continue</button>
            <div class="msg error" id="forgotError1"></div>
            <div class="back-link"><a onclick="showAuth()">← Back to login</a></div>
        </div>

        <!-- Step 2: Answer security question -->
        <div id="forgotStep2" style="display:none">
            <div class="step-title">Security Question</div>
            <div class="step-sub" id="securityQuestionText"></div>
            <div class="form-group">
                <label>Your Answer</label>
                <input type="text" id="securityAnswerInput" placeholder="Your answer" />
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Min 6 characters" />
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password" />
            </div>
            <button class="btn" onclick="resetPassword()">Reset Password</button>
            <div class="msg error" id="forgotError2"></div>
            <div class="back-link"><a onclick="showForgotStep1()">← Back</a></div>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/api';

    function showTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
        hideMessages();
    }

    function showForgot() {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('forgotSection').style.display = 'block';
    }

    function showAuth() {
        document.getElementById('forgotSection').style.display = 'none';
        document.getElementById('authSection').style.display = 'block';
    }

    function showForgotStep1() {
        document.getElementById('forgotStep2').style.display = 'none';
        document.getElementById('forgotStep1').style.display = 'block';
    }

    function showError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideMessages() {
        ['authError', 'authSuccess', 'forgotError1', 'forgotError2'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
    }

    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) return showError('authError', 'Please fill in all fields.');

        try {
            const res = await fetch(`${API}/users/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('userId', user.id);
                localStorage.setItem('userName', user.displayName);
                localStorage.setItem('userEmail', user.email);
                if (!user.onboardingComplete) {
                    window.location.href = 'onboarding.html';
                } else if (!user.incomeSetupComplete) {
                    window.location.href = 'income-setup.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                showError('authError', 'Invalid email or password.');
            }
        } catch (e) {
            showError('authError', 'Cannot connect to server.');
        }
    }

    async function signup() {
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const question = document.getElementById('signupQuestion').value;
        const answer = document.getElementById('signupAnswer').value.trim();

        if (!name || !email || !password || !question || !answer) {
            return showError('authError', 'Please fill in all fields.');
        }
        if (password.length < 6) return showError('authError', 'Password must be at least 6 characters.');

        try {
            const res = await fetch(`${API}/users/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, displayName: name, securityQuestion: question, securityAnswer: answer })
            });

            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('userId', user.id);
                localStorage.setItem('userName', user.displayName);
                localStorage.setItem('userEmail', user.email);
                window.location.href = 'onboarding.html';
            } else {
                const text = await res.text();
                showError('authError', text || 'Signup failed. Email may already exist.');
            }
        } catch (e) {
            showError('authError', 'Cannot connect to server.');
        }
    }

    async function getSecurityQuestion() {
        const email = document.getElementById('forgotEmail').value.trim();
        if (!email) return showError('forgotError1', 'Please enter your email.');

        try {
            const res = await fetch(`${API}/users/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('securityQuestionText').textContent = data.question;
                document.getElementById('forgotStep1').style.display = 'none';
                document.getElementById('forgotStep2').style.display = 'block';
            } else {
                showError('forgotError1', 'Email not found.');
            }
        } catch (e) {
            showError('forgotError1', 'Cannot connect to server.');
        }
    }

    async function resetPassword() {
        const email = document.getElementById('forgotEmail').value.trim();
        const answer = document.getElementById('securityAnswerInput').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!answer || !newPassword || !confirmPassword) {
            return showError('forgotError2', 'Please fill in all fields.');
        }
        if (newPassword.length < 6) {
            return showError('forgotError2', 'Password must be at least 6 characters.');
        }
        if (newPassword !== confirmPassword) {
            return showError('forgotError2', 'Passwords do not match.');
        }

        try {
            const res = await fetch(`${API}/users/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, securityAnswer: answer, newPassword })
            });

            if (res.ok) {
                showAuth();
                document.getElementById('authSuccess').textContent = 'Password reset! Please login.';
                document.getElementById('authSuccess').style.display = 'block';
            } else {
                const text = await res.text();
                showError('forgotError2', text || 'Incorrect answer. Try again.');
            }
        } catch (e) {
            showError('forgotError2', 'Cannot connect to server.');
        }
    }

    // allow Enter key
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            if (document.getElementById('loginForm').style.display !== 'none') login();
            else if (document.getElementById('signupForm').style.display !== 'none') signup();
        }
    });
</script>
</body>
</html>
